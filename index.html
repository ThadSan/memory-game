<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu de Memory</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" type="module"></script>
</head>
<body>
<header>
  <h1>Jeu de Memory</h1>
  <button id="themeToggle">🌙</button>
</header>

<div class="setup-form">
  <h2>Démarrer une nouvelle partie</h2>
  <form class="game-form">
    <input type="text" name="pseudo" id="pseudo" placeholder="Pseudo">
    <select name="difficulté" id="difficulty">
      <option value="4">Easy</option>
      <option value="5">Medium</option>
      <option value="6">Hard</option>
      <option value="8">Insane</option>
    </select>
    <select name="collection" id="collection">
      <option value="animals">animals</option>
      <option value="fruits">fruits</option>
      <option value="cars">cars</option>
    </select>
    <button type="submit">Jouer</button>
  </form>
</div>

<div class="leaderboard">
  <div class="leaderboard-header">
    <h2>🏆 Classement</h2>
    <select id="lb-difficulty">
      <option value="4">Easy</option>
      <option value="5">Medium</option>
      <option value="6">Hard</option>
      <option value="8">Insane</option>
    </select>
  </div>
  <table id="lb-table">
    <thead>
      <tr><th>#</th><th>Joueur</th><th>Temps</th></tr>
    </thead>
    <tbody id="lb-body"></tbody>
  </table>
</div>

<div class="game-area hidden">
  <div class="game-area-header">
    <button id="stop-replay" class="hidden replay-button">Stop replay</button>
    <span id="chrono" class="game-timer"></span>
    <button id="abandon">Abandon</button>
  </div>
  <div class="game-board"></div>
</div>

<div id="end-screen" class="hidden">
  <div id="end-panel">
    <p id="end-message"></p>
    <p id="end-time"></p>
    <p id="end-coups"></p>
    <button id="btn-replay">Revoir la partie</button>
    <button id="btn-new-game">Nouvelle partie</button>
  </div>
</div>

</body>
</html>
